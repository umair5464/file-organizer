name: Build Single Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Standalone File (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install watchdog customtkinter pyinstaller

      # --- Linux Single Binary Build ---
      - name: Build Linux Standalone Executable
        if: runner.os == 'Linux'
        run: |
          CTK_PATH=$(python3 -c "import customtkinter; print(customtkinter.__path__[0])")
          pyinstaller --noconfirm --onefile --windowed --add-data "$CTK_PATH:customtkinter/" --name "FileOrganizer-Linux" app.py

      # --- Windows Single .exe Build ---
      - name: Build Windows Standalone Exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $CTK_PATH = python -c "import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))"
          pyinstaller --noconfirm --onefile --windowed --add-data "$CTK_PATH;customtkinter/" --name "FileOrganizer-Windows.exe" app.py

      # --- Upload Artifacts ---
      - name: Upload Linux Binary
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-Linux
          path: dist/FileOrganizer-Linux

      - name: Upload Windows Exe
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: FileOrganizer-Windows
          path: dist/FileOrganizer-Windows.exe

  publish-release:
    name: Publish Combined GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release with Direct Executables
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/FileOrganizer-Linux/FileOrganizer-Linux
            artifacts/FileOrganizer-Windows/FileOrganizer-Windows.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}