name: Build Cross-Platform App Executables

on:
  push:
    tags:
      - 'v*' # Trigger tab hoga jab aap v1.0.0 jaisa tag push karenge
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  build:
    name: Build Executables
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install watchdog customtkinter pyinstaller

      # --- Linux Build Process ---
      - name: Build Standalone Application (Linux)
        if: runner.os == 'Linux'
        run: |
          CTK_PATH=$(python3 -c "import customtkinter; print(customtkinter.__path__[0])")
          pyinstaller --noconfirm --onedir --windowed --add-data "$CTK_PATH:customtkinter/" --name "FileOrganizer-Linux" app.py
          cd dist
          tar -czvf FileOrganizer-Linux.tar.gz FileOrganizer-Linux/

      # --- Windows Build Process ---
      - name: Build Standalone Executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $CTK_PATH = python -c "import customtkinter; import os; print(os.path.dirname(customtkinter.__file__))"
          pyinstaller --noconfirm --onedir --windowed --add-data "$CTK_PATH;customtkinter/" --name "FileOrganizer-Windows" app.py
          cd dist
          Compress-Archive -Path "FileOrganizer-Windows" -DestinationPath "FileOrganizer-Windows.zip"

      # --- Upload Assets to GitHub Releases ---
      - name: Upload Linux Asset to GitHub Release
        if: runner.os == 'Linux'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileOrganizer-Linux.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Asset to GitHub Release
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/FileOrganizer-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}